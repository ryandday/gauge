# @task(P1-T1) Initialize Rust project with dependencies
[package]
name = "sherpa"
version = "0.1.0"
edition = "2021"
description = "Interactive code review TUI for understanding diffs"
license = "MIT"
authors = ["Ryan Day"]

[[bin]]
name = "sherpa"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.28"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization for session persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Home directory for session storage
dirs = "6"

# Unified diff parsing
unidiff = "0.4"

# TUI spinner widget
throbber-widgets-tui = "0.10"

# Date/time for export filenames
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
